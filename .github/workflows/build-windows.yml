name: Build AI HUB for Windows
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build windowed portable folder (avoids one-file self-extraction)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name AIHub --collect-all tkinter --add-data "assets;assets" main.py
      - name: Verify executable and produce checksum
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AIHub/AIHub.exe")) { throw "dist/AIHub/AIHub.exe was not generated" }
          Get-Item "dist/AIHub/AIHub.exe" | Format-List FullName,Length
          $hash = (Get-FileHash "dist/AIHub/AIHub.exe" -Algorithm SHA256).Hash
          "$hash  AIHub.exe" | Set-Content "dist/AIHub/SHA256SUMS.txt"
      - name: Upload portable AI HUB folder
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-Windows-x64-Portable
          path: dist/AIHub/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-build-logs
          path: build/AIHub/warn-AIHub.txt
          if-no-files-found: ignore
          retention-days: 30
