name: Build AI HUB for Windows
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build one-file windowed executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AIHub --collect-all tkinter main.py
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AIHub.exe")) { throw "dist/AIHub.exe was not generated" }
          Get-Item "dist/AIHub.exe" | Format-List FullName,Length
      - name: Upload AIHub.exe
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-Windows-x64
          path: dist/AIHub.exe
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-build-logs
          path: build/AIHub/warn-AIHub.txt
          if-no-files-found: ignore
          retention-days: 30
